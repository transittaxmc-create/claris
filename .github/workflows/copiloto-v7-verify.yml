name: Copiloto V7 branch verification

on:
  push:
    branches:
      - feat/copiloto-v7-phase1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copiloto-v7-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@12.3.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Existing CRM validation tests
        run: pnpm test:crm-push

      - name: Production build (no deployment)
        run: pnpm build
