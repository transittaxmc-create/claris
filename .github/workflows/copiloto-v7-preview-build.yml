name: Copiloto V7 preview branch build

on:
  push:
    branches:
      - feat/copiloto-v7-phase1-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run CRM push validation tests
        run: pnpm test:crm-push
      - name: Build Next.js application
        run: pnpm build
